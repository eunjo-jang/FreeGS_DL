data_dir: "data/dataset_freegs"
splits_path: "data/splits.json"
checkpoint_path: "checkpoints/pinn_best.pt"
image_out_dir: "figures/pinn"

train:
  batch_size: 16
  val_batch_size: 32
  lr: 0.001
  weight_decay: 1.0e-06
  max_epochs: 400
  patience: 30
  seed: 42

  # PINN-specific
  lambda_phys: 1.0e-4   # physics loss weight (중요!)

  # Coord-MLP / DeepONet과 동일
  points_per_sample: 1024

model:
  name: "pinn"
  in_dim: 41
  hidden: [256, 512, 256]

generate:
  n_samples: 200
  seed: 0
  nx: 65
  ny: 65
  Rmin: 0.1
  Rmax: 2.0
  Zmin: -1.0
  Zmax: 1.0